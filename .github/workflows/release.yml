# 自动构建与发布
#  - 推送 v 开头的标签（例如 v1.0.1）：自动构建安装包 + 绿色版，并创建一个“草稿” Release（确认无误后再手动点发布）
#  - 也可以在 Actions 页面手动运行：只构建，结果在本次运行的 Artifacts 里下载
name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 1.0.1（留空则使用 VDownloader.csproj 里的版本）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: 准备 Inno Setup（中文语言文件需要 6.5 及以上）
        shell: pwsh
        run: choco upgrade innosetup -y --no-progress

      - name: 下载组件并构建
        shell: pwsh
        run: |
          $version = '${{ github.event.inputs.version }}'
          if ('${{ github.ref_type }}' -eq 'tag') { $version = '${{ github.ref_name }}' }
          ./scripts/build-release.ps1 -Version $version -FetchTools

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: VDownloader-build
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: 创建草稿 Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: 万能视频下载器 ${{ github.ref_name }}
          body_path: .github/release-body.md
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
