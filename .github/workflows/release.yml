# 自动构建与发布
#  - 推送 v 开头的标签（例如 v1.0.1）：自动构建安装包 + 绿色版，并直接发布 Release
#    （说明 = CHANGELOG.md 里对应版本的段落 + .github/release-body.md）
#  - 也可以在 Actions 页面手动运行：只构建，结果在本次运行的 Artifacts 里下载
name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 1.0.1（留空则使用 VDownloader.csproj 里的版本）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: 准备 Inno Setup（中文语言文件需要 6.5 及以上）
        shell: pwsh
        run: choco upgrade innosetup -y --no-progress

      # 用 Windows PowerShell 5.1（和本地开发环境一致）。
      # 注意：run 里只能写纯 ASCII —— Windows PowerShell 会按 ANSI 读取 GitHub 生成的临时脚本，中文会导致语法错误。
      # 具体逻辑在 scripts/ci-build.ps1（UTF-8 BOM），出错时会输出注解，在运行摘要页直接可见。
      - name: 下载组件并构建
        shell: powershell
        run: .\scripts\ci-build.ps1 -RefType '${{ github.ref_type }}' -RefName '${{ github.ref_name }}' -InputVersion '${{ github.event.inputs.version }}'

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: VDownloader-build
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: 发布 Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          make_latest: 'true'
          name: 万能视频下载器 ${{ github.ref_name }}
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
